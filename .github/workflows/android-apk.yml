name: Build Android APK (test)

# Run by hand: GitHub > Actions > "Build Android APK (test)" > Run workflow.
# Produces an installable test APK (signed with a debug key, NOT for Google Play) and attaches it to a GitHub Release.
on:
  workflow_dispatch:
  # Also runs by itself whenever the phone app (or this file) changes, so a push is enough to get a new APK.
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Allow more memory for Gradle
        run: |
          printf "\n" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: "Build the APK (phones only - arm64 and 32-bit arm)"
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Show why the build failed (as readable messages on the run page)
        if: failure()
        working-directory: mobile/android
        shell: bash
        run: |
          [ -f gradle.log ] || { echo "::error title=No Gradle log::The build stopped before Gradle started."; exit 0; }
          key=$(grep -n -E "What went wrong|Execution failed|error:|Could not|FAILURE|Caused by|Cannot|not found|Unresolved|Error:" gradle.log | head -25 | cut -c1-300)
          tail=$(tail -n 40 gradle.log | cut -c1-300)
          echo "::error title=Gradle key lines::${key//$'\n'/%0A}"
          echo "::error title=Gradle last 40 lines::${tail//$'\n'/%0A}"

      - name: Collect the APK
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/*.apk ../dist-apk/DALIL-test.apk
          ls -la ../dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: DALIL-test-apk
          path: dist-apk/DALIL-test.apk

      - name: Publish as a GitHub Release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DALIL test APK #${{ github.run_number }}
          prerelease: true
          body: |
            Test build for installing on an Android phone. Not for Google Play (debug-signed).
            Open this page on the phone, tap DALIL-test.apk, allow "install unknown apps" for your browser once, then install.
          files: dist-apk/DALIL-test.apk
