name: Build Play Store bundle (AAB)

# Run by hand: GitHub > Actions > "Build Play Store bundle (AAB)" > Run workflow.
# Produces a release-signed .aab to upload in Google Play Console. Needs the 4 signing secrets (see mobile/docs/PLAY_UPLOAD.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the signing secrets exist
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$K" ] && [ -n "$P" ] || { echo "::error title=Missing secrets::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS in Settings > Secrets and variables > Actions."; exit 1; }

      - name: Install packages
        run: npm ci

      - name: Version code (must go up with every Play upload)
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.android.versionCode=100+Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(a,null,2));console.log('versionCode',a.expo.android.versionCode)"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Add the release signing key
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          clean=$(printf '%s' "$K" | tr -cd 'A-Za-z0-9+/=')
          echo "Pasted key file is ${#K} characters; ${#clean} are valid (a correct paste is 3528)."
          if ! printf '%s' "$clean" | base64 -d > android/app/upload.jks 2>/dev/null || [ ! -s android/app/upload.jks ]; then
            echo "::error title=ANDROID_KEYSTORE_BASE64 is wrong::Re-paste the WHOLE single line from dalil-upload-base64.txt (value only)."
            exit 1
          fi
          # passwords and alias: remove any spaces / line breaks that came along with the paste
          SP=$(printf '%s' "$SP" | tr -d '[:space:]'); KP=$(printf '%s' "$KP" | tr -d '[:space:]'); KA=$(printf '%s' "$KA" | tr -d '[:space:]')
          echo "Password lengths: store ${#SP}, key ${#KP} (correct is 24 each). Alias: $KA"
          if ! keytool -list -keystore android/app/upload.jks -storepass "$SP" -alias "$KA" >/dev/null 2>&1; then
            echo "::error title=Signing password or alias is wrong::keytool could not open the key. Check ANDROID_KEYSTORE_PASSWORD (24 characters, value only) and ANDROID_KEY_ALIAS (dalil-upload)."
            exit 1
          fi
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "DALIL_STORE_FILE=upload.jks"
            echo "DALIL_STORE_PASSWORD=$SP"
            echo "DALIL_KEY_ALIAS=$KA"
            echo "DALIL_KEY_PASSWORD=$KP"
          } >> android/gradle.properties
          python3 scripts/patch-signing.py
          grep -n "signingConfig" android/app/build.gradle

      - name: Build the bundle (phones only)
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Show why the build failed
        if: failure()
        working-directory: mobile/android
        shell: bash
        run: |
          [ -f gradle.log ] || { echo "::error title=No Gradle log::Stopped before Gradle."; exit 0; }
          key=$(grep -n -E "What went wrong|Execution failed|error:|Could not|FAILURE|Caused by|not found|Unresolved|Error:" gradle.log | head -25 | cut -c1-300)
          echo "::error title=Gradle key lines::${key//$'\n'/%0A}"

      - uses: actions/upload-artifact@v4
        with:
          name: DALIL-play-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
