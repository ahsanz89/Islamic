name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache raw sources
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ hashFiles('scripts/collections.config.mjs', 'scripts/fetch-sources.mjs') }}
      - run: npm run fetch
      - run: npm run data
      - name: Build static site
        run: npm run build
        env:
          # Project pages live at https://<user>.github.io/<repo>/ ; remove this for a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
